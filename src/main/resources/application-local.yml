spring:
    config:
        import: "optional:aws-parameterstore:"
    cloud:
        aws:
            credentials:
                access-key: test
                secret-key: test
            region:
                static: ap-northeast-2
            stack:
                auto: false
    datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:testdb
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: create
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    servlet:
        multipart:
            max-file-size: 10MB
    h2:
        console:
            enabled: true
            path: /h2-console

S3_BUCKET_NAME: test-bucket
APP_MESSAGE: local-test
TEAM-NAME: local-team
CLOUDFRONT_DOMAIN: dnapymaa2h16i.cloudfront.net